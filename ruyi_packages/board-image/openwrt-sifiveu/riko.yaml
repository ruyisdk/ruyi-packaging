format: v1

source:
  metadata:
    desc: f"Official OpenWRT {upstream_version} image for SiFive Unmatched"
    vendor:
      name: OpenWrt
      eula:

openwrt-sifive-unmatched:
  version: version(minor=(_v := upstream_version.split("."))[0]+_v[1], patch=_v[2])
  distfiles:
    - name: disk(substring("-sifiveu-generic-sifive_unmatched-ext4-sdcard.img.gz"))
