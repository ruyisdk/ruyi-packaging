[nvchecker]
source = "regex"
url = "https://mirror.iscas.ac.cn/revyos/extra/images/lcon4a/"
regex = '<a href="([\d.]+)/">[\d.]+/</a>'

[source]
# see: riko.upstreams.regex.RegexUpstream
regex_file_url = "{{nvchecker.url}}{{upstream_version}}/"
regex_file_regex = '<a href="(.+)">.+</a> '

[entities]
image-combo = [
    "revyos-sipeed-lcon4a",
    "uboot-revyos-sipeed-lcon4a-8g",
    "uboot-revyos-sipeed-lcon4a-16g"
]

[policies]
uboot-revyos-sipeed-lcon4a-8g = ["keep_back"]
uboot-revyos-sipeed-lcon4a-16g = ["keep_back"]
