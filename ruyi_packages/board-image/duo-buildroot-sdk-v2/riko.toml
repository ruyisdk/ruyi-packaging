[nvchecker]
source = "github"
github = "milkv-duo/duo-buildroot-sdk-v2"
use_latest_release = true

[entities]
image-combo = [
    "buildroot-sdk-milkv-duo",
    "buildroot-sdk-milkv-duo256m",
    "buildroot-sdk-milkv-duos-sd",
    "buildroot-sdk-milkv-duo256m-python",
    "buildroot-sdk-milkv-duo-python",
]

[policies]
# those combos will never upgrade
# see: https://github.com/ruyisdk/packages-index/pull/75
# so, use `skip` policy here
buildroot-sdk-milkv-duo256m-python = ["skip"]
buildroot-sdk-milkv-duo-python = ["skip"]
