[nvchecker]
source = "regex"
url = "https://mirror.iscas.ac.cn/revyos/extra/images/laptop4a/"
regex = '<a href="([\d.]+)/">[\d.]+/</a>'

[source]
# see: riko.upstreams.regex.RegexUpstream
regex_file_url = "{{nvchecker.url}}{{upstream_version}}/"
regex_file_regex = '<a href="(.+)">.+</a> '

[entities]
image-combo = [
    "revyos-sipeed-laptop4a",
    "uboot-revyos-sipeed-laptop4a-8g",
    "uboot-revyos-sipeed-laptop4a-16g"
]
