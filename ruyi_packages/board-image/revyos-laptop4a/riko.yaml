format: v1

source:
  metadata:
    desc: f"RevyOS {upstream_version} image for Sipeed Lichee Book 4A"
    vendor:
      name: PLCT
      eula:

revyos-sipeed-laptop4a:
  version: version(major=0, minor=upstream_version, patch=0)
  distfiles:
    - name: boot(regex("^boot-.+\\.ext4"))
    - name: root(regex("^root-.+\\.ext4"))

uboot-revyos-sipeed-laptop4a-8g:
  metadata:
    desc: f"U-Boot image for Lichee Book 4A (8G RAM) and RevyOS {upstream_version}"
  version: version(minor=upstream_version, patch=0)
  distfiles:
    - name: uboot(substring("u-boot-with-spl-laptop4a.bin"))

uboot-revyos-sipeed-laptop4a-16g:
  metadata:
    desc: f"U-Boot image for Lichee Book 4A (16G RAM) and RevyOS {upstream_version}"
  version: version(minor=upstream_version, patch=0)
  distfiles:
    - name: uboot(substring("-16g.bin"))