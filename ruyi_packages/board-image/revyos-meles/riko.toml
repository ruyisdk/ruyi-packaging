[nvchecker]
source = "regex"
url = "https://mirror.iscas.ac.cn/revyos/extra/images/meles/"
regex = '<a href="([\d.]+)/">[\d.]+/</a>'

[source]
# see: riko.upstreams.regex.RegexUpstream
regex_file_url = "{{nvchecker.url}}{{upstream_version}}/"
regex_file_regex = '<a href="(.+)">.+</a> '

[entities]
image-combo = [
    "revyos-milkv-meles",
    "uboot-revyos-milkv-meles-4g",
    "uboot-revyos-milkv-meles-8g",
    "uboot-revyos-milkv-meles-16g"
]

