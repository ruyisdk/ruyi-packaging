[nvchecker]
source = "regex"
url = "https://mirror.iscas.ac.cn/redleafos/extra/images/"
regex = '<a href="([\d.]+)/">[\d.]+/</a>'

[source]
# see: riko.upstreams.regex.RegexUpstream
regex_file_url = "{{nvchecker.url}}{{upstream_version}}/"
regex_file_regex = '<a href="(.+)">.+</a> '

[entities]
image-combo = [
    "redleafos-xiangshan-nanhu",
]
